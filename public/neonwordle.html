    <style>
        .content-container {
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Skor Paneli */
        .score-panel {
            display: none; 
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 20px;
            width: 100%;
        }

        .score-box {
            background: rgba(28, 26, 20, 0.7);
            border: 1px solid rgba(102, 136, 189, 0.25);
            border-radius: 3px;
            padding: 8px 24px;
            text-align: center;
            min-width: 100px;
        }

        .score-box-label {
            font-size: 0.68rem;
            color: #6b6455;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .score-box-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: #6688bd;
            line-height: 1.2;
        }

        /* Başlangıç Ekranı */
        #start-screen {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
            width: 100%;
        }
        
        .difficulty-btn {
            background: rgba(28, 26, 20, 0.8);
            border: 2px solid #6688bd;
            color: #6688bd;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            
        }

        .difficulty-btn:hover {
            background: #2f4a78;
            color: #e8e0cd;
            
            transform: translateY(-2px);
        }

        /* Oyun Alanı */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #board {
            display: grid;
            gap: 6px;
            margin-bottom: 20px;
        }

        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid #2e2b22;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 800;
            color: #e8e0cd;
            text-transform: uppercase;
            border-radius: 2px;
            transition: transform 0.4s ease;
        }

        /* Klavye Alanı */
        #keyboard {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 500px;
        }

        .key-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key {
            background: #201e17;
            border: 1px solid #2e2b22;
            color: #e8e0cd;
            padding: 12px 0;
            flex: 1;
            border-radius: 2px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
        }
        
        .key.large {
            flex: 1.5;
            font-size: 0.85rem;
        }

        .correct { background: #10b981 !important; border-color: #10b981 !important; color: white !important; }
        .present { background: #f59e0b !important; border-color: #f59e0b !important; color: white !important; }
        .absent { background: #2e2b22 !important; border-color: #2e2b22 !important; color: #a49b85 !important; }
        .active { border-color: #6688bd !important; }
        
        .pop { animation: pop 0.1s ease-in-out; }
        @keyframes pop { 50% { transform: scale(1.1); } }
        
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .flip { transform: rotateX(90deg); }

        .notification {
            position: fixed;
            top: 20px;
            background: #e8e0cd;
            color: #15140f;
            padding: 12px 24px;
            border-radius: 2px;
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }

        /* Oyun sonunda kalıcı olarak duran doğru cevap paneli */
        #answer-reveal {
            display: none;
            margin-top: 18px;
            padding: 14px 26px;
            border-radius: 3px;
            border: 1px solid #3a362b;
            background: rgba(28, 26, 20, 0.85);
            text-align: center;
            animation: revealIn 0.35s ease;
        }
        #answer-reveal .answer-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #a49b85;
            text-transform: uppercase;
        }
        #answer-reveal .answer-word {
            margin-top: 6px;
            font-size: 1.9rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: #6688bd;
            
        }
        #answer-reveal.win .answer-word { color: #22c55e;  }
        @keyframes revealIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        #action-buttons {
            display: none;
            gap: 15px;
            margin-top: 20px;
        }

        /* Yeni Ana Menü Butonu Tasarımı */
        .back-btn {
            margin-top: 25px;
            background: transparent;
            border: 1px solid #3a362b;
            color: #a49b85;
            padding: 10px 20px;
            border-radius: 2px;
            font-family: var(--yazi);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #2e2b22;
            color: #e8e0cd;
            border-color: #6b6455;
        }

        /* Süre kutusu uyarı durumları */
        .score-box-value.uyari { color: #ef4444; }
        .score-box-value.nabiz { animation: sureNabiz 0.6s ease-in-out infinite; }
        @keyframes sureNabiz { 50% { transform: scale(1.12); } }
    </style>
</head>

        const WORDS_6 = "AFİYET,ALFABE,AMATÖR,AMBLEM,ANKARA,ANONİM,ANTİKA,ARALIK,ASGARİ,AVUKAT,BAHANE,BAKKAL,BALANS,BALAYI,BALKAN,BANKER,BARDAK,BASINÇ,BASKET,BAYRAK,BAYRAM,BAŞARI,BAŞKAN,BEDAVA,BERBER,BODRUM,BOSTAN,BUHRAN,BULGUR,BULVAR,BUĞDAY,BÜLBÜL,BÜLTEN,BİNBİR,BİRKAÇ,BİRLİK,CENAZE,CENGİZ,CENNET,CERRAH,CETVEL,CEVHER,CEYLAN,CÜZDAN,DALGIÇ,DEFTER,DEKONT,DERECE,DESTEK,DEVRİM,DOKTOR,DÜKKAN,DÜRBÜN,DİKKAT,DİRSEK,EFSANE,EKSTRA,ELBİSE,FAYANS,FORMÜL,FİNCAN,GALERİ,GARSON,GAZETE,GERÇEK,GRAFİK,GÖMLEK,GÜNCEL,GÜNDEM,HAKSIZ,HANGAR,HARİKA,HASRET,HATIRA,HAVUZU,HAYRAN,HAYVAN,HAZİNE,HEDİYE,HEYKEL,HIRSIZ,HUKUKİ,HÜNKAR,HİKAYE,HİZMET,HİÇBİR,ILIMAN,ISITMA,IŞILTI,KADEME,KAFİYE,KALKAN,KALORİ,KAMERA,KAMPÜS,KAMYON,KANAAT,KANEPE,KANSER,KANTİN,KAPALI,KAPLAN,KAPSAM,KAPTAN,KARDEŞ,KARTAL,KARTON,KASABA,KAUÇUK,KAYISI,KAYNAK,KAZANÇ,KAİNAT,KELİME,KESKİN,KLAVYE,KOLTUK,KOMEDİ,KOMPLE,KONFOR,KONGRE,KONSER,KONTAK,KORSAN,KOSTÜM,KOVBOY,KUAFÖR,KURBAN,KURŞUN,KUVVET,KÜKÜRT,KÜLTÜR,KİLİSE,KİRPİK,LAHANA,LEOPAR,LEYLEK,LEZZET,MACERA,MAHSUL,MAKSAT,MAKİNE,MANDAL,MANEVİ,MANTAR,MANŞET,MASRAF,MATBAA,MAYMUN,MAĞAZA,MEKTUP,MELODİ,MEMNUN,MENDİL,MENFEZ,MERCEK,MERKEZ,MERMER,MESAFE,MESELE,MESLEK,MEVSİM,MEYDAN,MEÇHUL,MODERN,MUCİZE,MUHTAR,MUSLUK,MUTLAK,MİKTAR,MİLLET,MİLYON,MİMARİ,MİSKET,MİTİNG,NANKÖR,NEFRET,NORMAL,NİSPET,OLANAK,ONARIM,ORANTI,ORKİDE,OTOBÜS,OTOMAT,OTOYOL,OYUNCU,PANCAR,PARFÜM,PARMAK,PETROL,PEYNİR,PLAKET,PORTRE,PUSULA,PİYANO,REHBER,REKLAM,RESSAM,REÇETE,RÜZGAR,SAADET,SALATA,SANDAL,SANDIK,SANİYE,SEKSEN,SEMBOL,SENTEZ,SERVİS,SEVİYE,SOHBET,SOSYAL,SUALTI,SULTAN,SÖZLÜK,SÜNGER,SÜTLAÇ,SİGARA,SİNCAP,SİNEMA,SİSTEM,TABLET,TAHMİN,TAKVİM,TARÇIN,TARİFE,TASARI,TAVŞAN,TEBRİK,TEDAVİ,TEDBİR,TEHDİT,TEKLİF,TEKNİK,TEMSİL,TENEKE,TEORİK,TERCİH,TERLİK,TERMOS,TESLİM,TOPLAM,TOPRAK,TRAFİK,TÜRKÇE,ULUSAL,UMUTLU,UĞURLU,VAHŞET,VARLIK,VOLKAN,VİCDAN,VİTRİN,VİZYON,YALNIZ,YANGIN,YANLIŞ,YAPRAK,YARDIM,YASTIK,YAZILI,YAĞMUR,YENGEÇ,YILDIZ,YORGAN,YOĞURT,YÜKSEK,ZAMBAK,ZANAAT,ZEYTİN,ZİRAAT,ÇAKMAK,ÇARŞAF,ÇAVDAR,ÇAĞDAŞ,ÇEMBER,ÇENGEL,ÇEYREK,ÇIPLAK,ÖDENEK,ÜRETİM,ÜZÜNTÜ,İBADET,İHANET,İKİNCİ,İLETİM,İLGİNÇ,İNANIŞ,İNSANİ,İSKELE,İTİBAR,İÇECEK,İÇERİK,İŞARET,İŞGÜCÜ,ŞAHANE,ŞAKACI,ŞEFKAT,ŞELALE,ŞEYTAN,ŞÖHRET,ŞÖMİNE,ŞİDDET,ŞİRKET".split(",");

        let validDictionary = new Set(); 
        
        window.onload = async () => {
            try {
                // Sözlük kendi sunucumuzda: dış servisin hız sınırına (429) takılmaz.
                let res = await fetch("words.txt");
                // Hata sayfası da metin döndüğü için durum kodu kontrol edilmeli.
                if (!res.ok) throw new Error("Sözlük indirilemedi (HTTP " + res.status + ")");
                let text = await res.text();
                text.split('\n').forEach(w => {
                    let cleanWord = w.trim().toLocaleUpperCase('tr-TR')
                                     .replace(/Â/g, 'A').replace(/Û/g, 'U').replace(/Î/g, 'İ');
                    if (cleanWord.length >= 4 && cleanWord.length <= 6) {
                        validDictionary.add(cleanWord);
                    }
                });
                console.log("64.000+ Kelimelik devasa sözlük başarıyla yüklendi!");
            } catch(e) {
                console.warn("Devasa sözlük yüklenemedi, oyun sadece kendi hafızasını kullanacak.");
            }
        };

        let wordLength = 5;
        let targetWord = "";
        let currentRow = 0;
        let currentCol = 0;
        let guesses = [];
        let isGameOver = false;
        let isChecking = false; 
        let timedOut = false;

        let currentScore = 0;
        let bestScore = parseInt(localStorage.getItem("wordleBest")) || 0;
        
        const board = document.getElementById("board");
        const keyboard = document.getElementById("keyboard");
        const notif = document.getElementById("notification");
        const scorePanel = document.getElementById("score-panel");
        const actionBtns = document.getElementById("action-buttons");
        
        document.getElementById("bestScoreEl").innerText = bestScore;

        const keys = [
            ["E","R","T","Y","U","I","O","P","Ğ","Ü"],
            ["A","S","D","F","G","H","J","K","L","Ş","İ"],
            ["ENTER","Z","C","V","B","N","M","Ö","Ç","SİL"]
        ];

        // --- OYUN SONU CEVAP PANELİ ---
        const answerBox = document.getElementById("answer-reveal");

        function showAnswer(word, win, label) {
            document.getElementById("answerLabel").innerText = label;
            document.getElementById("answerWord").innerText = word.split("").join(" ");
            answerBox.classList.toggle("win", !!win);
            answerBox.style.display = "block";
        }

        function hideAnswer() {
            answerBox.style.display = "none";
            answerBox.classList.remove("win");
        }

        function showNotification(msg) {
            notif.innerText = msg;
            notif.style.opacity = "1";
            setTimeout(() => notif.style.opacity = "0", 2500);
        }

        // --- SÜRE ---
        const TIME_LIMITS = { 4: 180, 5: 240, 6: 300 }; // saniye: 4 harf 3dk, 5 harf 4dk, 6 harf 5dk
        let timeLeft = 0;
        let timerInterval = null;
        const timerEl = document.getElementById("timerEl");

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const ss = s % 60;
            return `${m}:${String(ss).padStart(2, "0")}`;
        }

        function updateTimerUI() {
            timerEl.innerText = formatTime(Math.max(0, timeLeft));
            timerEl.classList.toggle("uyari", timeLeft <= 30);
            timerEl.classList.toggle("nabiz", timeLeft <= 10 && timeLeft > 0);
        }

        function startTimer() {
            stopTimer();
            timeLeft = TIME_LIMITS[wordLength];
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    stopTimer();
                    timeUp();
                }
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function timeUp() {
            if (isGameOver) return;
            isGameOver = true;
            isChecking = false;
            timedOut = true;
            currentScore = 0;
            document.getElementById("currentScoreEl").innerText = currentScore;
            showNotification("Süre doldu!");
            showAnswer(targetWord, false, "Süre Doldu - Doğru Kelime");
            document.getElementById("next-btn").innerText = "Tekrar Dene";
            actionBtns.style.display = "flex";
        }

        function startGame(length) {
            wordLength = length;
            currentScore = 0; 
            document.getElementById("currentScoreEl").innerText = currentScore;
            
            document.getElementById("start-screen").style.display = "none";
            scorePanel.style.display = "flex";
            document.getElementById("game-screen").style.display = "flex";
            
            setupGame();
        }

        function nextWord() {
            setupGame();
        }

        function setupGame() {
            let dict = wordLength === 4 ? WORDS_4 : (wordLength === 5 ? WORDS_5 : WORDS_6);
            targetWord = dict[Math.floor(Math.random() * dict.length)];
            
            currentRow = 0;
            currentCol = 0;
            isGameOver = false;
            isChecking = false;
            timedOut = false;
            actionBtns.style.display = "none";
            hideAnswer();
            
            board.style.gridTemplateColumns = `repeat(${wordLength}, 1fr)`;
            initBoard();
            initKeyboard();
            startTimer();
        }

        function initBoard() {
            board.innerHTML = "";
            guesses = Array(6).fill().map(() => Array(wordLength).fill(""));
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < wordLength; c++) {
                    let tile = document.createElement("div");
                    tile.id = `tile-${r}-${c}`;
                    tile.className = "tile";
                    board.appendChild(tile);
                }
            }
        }

        function initKeyboard() {
            keyboard.innerHTML = "";
            keys.forEach(row => {
                let rowEl = document.createElement("div");
                rowEl.className = "key-row";
                row.forEach(key => {
                    let btn = document.createElement("div");
                    btn.className = "key";
                    btn.id = `key-${key}`;
                    btn.innerText = key;
                    if(key === "ENTER" || key === "SİL") btn.classList.add("large");
                    
                    btn.onclick = () => handleInput(key);
                    rowEl.appendChild(btn);
                });
                keyboard.appendChild(rowEl);
            });
        }

        function handleInput(key) {
            if (isGameOver || isChecking) return; 

            if (key === "SİL" || key === "Backspace") {
                if (currentCol > 0) {
                    currentCol--;
                    guesses[currentRow][currentCol] = "";
                    let tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                    tile.innerText = "";
                    tile.classList.remove("active");
                }
                return;
            }

            if (key === "ENTER" || key === "Enter") {
                if (currentCol === wordLength) {
                    isChecking = true; 
                    checkGuess(); 
                }
                else {
                    showNotification("Yeterli harf yok!");
                    shakeRow();
                }
                return;
            }

            if (/^[A-ZÇĞİIÖŞÜ]$/.test(key) && currentCol < wordLength) {
                guesses[currentRow][currentCol] = key;
                let tile = document.getElementById(`tile-${currentRow}-${currentCol}`);
                tile.innerText = key;
                tile.classList.add("pop", "active");
                setTimeout(() => tile.classList.remove("pop"), 100);
                currentCol++;
            }
        }

        function shakeRow() {
            for (let c = 0; c < wordLength; c++) {
                let tile = document.getElementById(`tile-${currentRow}-${c}`);
                tile.classList.add("shake");
                setTimeout(() => tile.classList.remove("shake"), 400);
            }
        }

        function checkGuess() {
            let guess = guesses[currentRow].join("");
            let dict = wordLength === 4 ? WORDS_4 : (wordLength === 5 ? WORDS_5 : WORDS_6);
            
            if (!validDictionary.has(guess) && !dict.includes(guess)) {
                showNotification("Sözlükte bulunamadı!");
                shakeRow();
                isChecking = false; 
                return; 
            }

            // Bu tahminle oyun bitecekse (doğru cevap ya da son satır) süreyi hemen durdur
            if (guess === targetWord || currentRow === 5) stopTimer();

            let targetArr = targetWord.split("");
            let guessArr = guess.split("");
            let tileColors = Array(wordLength).fill("absent");
            
            let activeRow = currentRow; 

            for (let i = 0; i < wordLength; i++) {
                if (guessArr[i] === targetArr[i]) {
                    tileColors[i] = "correct";
                    targetArr[i] = null; 
                }
            }

            for (let i = 0; i < wordLength; i++) {
                if (tileColors[i] !== "correct" && targetArr.includes(guessArr[i])) {
                    tileColors[i] = "present";
                    targetArr[targetArr.indexOf(guessArr[i])] = null;
                }
            }

            for (let i = 0; i < wordLength; i++) {
                setTimeout(() => {
                    let tile = document.getElementById(`tile-${activeRow}-${i}`);
                    tile.classList.add("flip");
                    setTimeout(() => {
                        tile.classList.remove("flip", "active");
                        tile.classList.add(tileColors[i]);
                        updateKeyboardColor(guessArr[i], tileColors[i]);
                    }, 200); 
                }, i * 250); 
            }

            setTimeout(() => {
                if (timedOut) { isChecking = false; return; }
                if (guess === targetWord) {
                    let earnedPoints = (6 - currentRow) * 10; 
                    currentScore += earnedPoints;
                    document.getElementById("currentScoreEl").innerText = currentScore;
                    
                    if (currentScore > bestScore) {
                        bestScore = currentScore;
                        localStorage.setItem("wordleBest", bestScore);
                        document.getElementById("bestScoreEl").innerText = bestScore;
                    }

                    showNotification(`TEBRİKLER! +${earnedPoints} Puan`);
                    showAnswer(targetWord, true, "Bildin!");
                    document.getElementById("next-btn").innerText = "Sonraki Kelime";
                    isGameOver = true;
                    actionBtns.style.display = "flex";

                } else if (currentRow === 5) {
                    showNotification("OYUN BİTTİ!");
                    showAnswer(targetWord, false, "Doğru Kelime");
                    currentScore = 0; 
                    document.getElementById("currentScoreEl").innerText = currentScore;
                    
                    document.getElementById("next-btn").innerText = "Tekrar Dene";
                    isGameOver = true;
                    actionBtns.style.display = "flex";

                } else {
                    currentRow++;
                    currentCol = 0;
                }
                
                isChecking = false; 
                
            }, wordLength * 250);
        }

        function updateKeyboardColor(letter, colorClass) {
            let keyBtn = document.getElementById(`key-${letter}`);
            if (!keyBtn) return;
            if (keyBtn.classList.contains("correct")) return;
            if (keyBtn.classList.contains("present") && colorClass === "absent") return;

            keyBtn.classList.remove("correct", "present", "absent");
            keyBtn.classList.add(colorClass);
        }

        document.addEventListener("keydown", (e) => {
            let key = e.key;
            if (key === "Enter" || key === "Backspace") {
                handleInput(key);
            } else {
                let upperKey = key.toLocaleUpperCase('tr-TR');
                if (upperKey.length === 1 && /^[A-ZÇĞİIÖŞÜ]$/.test(upperKey)) {
                    handleInput(upperKey);
                }
            }
        });
    </script>
